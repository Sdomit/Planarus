# AgentBoard — Cloudflare Tunnel config template.
#
# 1. Copy this file to:  C:\Users\<you>\.cloudflared\config.yml
# 2. Replace the three <PLACEHOLDERS> below.
# 3. Run:  cloudflared tunnel run agentboard
#
# Full walkthrough: docs/guide/connect-agentboard-to-chatgpt.md (Step 1).

tunnel: agentboard
credentials-file: C:\Users\<YOUR-WINDOWS-USERNAME>\.cloudflared\<YOUR-TUNNEL-ID>.json

ingress:
  # Only the read-only external API and the health check reach AgentBoard.
  # Every other path is refused at the tunnel (defense in depth).
  - hostname: <agentboard.example.com>
    path: ^/api/external/.*
    service: http://127.0.0.1:8000
  - hostname: <agentboard.example.com>
    path: ^/health$
    service: http://127.0.0.1:8000
  # Catch-all: anything not matched above gets a 404 from the tunnel itself.
  - service: http_status:404
