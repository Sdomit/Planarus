name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest

  web:
    name: Web (vitest + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No version here on purpose: action-setup reads packageManager from
      # package.json, so the pin lives in exactly one place.
      # That pin is pnpm 10.x, NOT 11.x: pnpm 11 requires Node >=22.13 (it
      # imports node:sqlite) and this repo is on Node 20. 10.26+ is what makes
      # pnpm-workspace.yaml's allowBuilds key meaningful. Raising Node to 22
      # would let us move to pnpm 11 — a separate change.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:web
      - run: pnpm typecheck:web
      - run: pnpm build:web

  api-postgres:
    name: API migrations (Postgres dialect)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: planarus
          POSTGRES_PASSWORD: planarus
          POSTGRES_DB: planarus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planarus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLANARUS_DATABASE_URL: postgresql+psycopg2://planarus:planarus@localhost:5432/planarus
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,postgres]"
      - name: Migrate to head, assert schema, roundtrip
        run: |
          alembic upgrade head
          python scripts/assert_pg_schema.py
          alembic downgrade base
          alembic upgrade head
      # The rest of the suite runs on SQLite, whose single writer masks the
      # approval apply race entirely. This is the only place that exercises
      # concurrent writers on the dialect we actually deploy on.
      - name: Approval concurrency (real Postgres)
        run: python -m pytest tests/test_approval_concurrency_pg.py -q

  docker-build:
    name: Docker (compose build + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: docker compose build
      - name: Start stack
        run: docker compose up -d
      - name: Wait for the API to become healthy
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T api python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)" >/dev/null 2>&1; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API never became healthy within 60s"
          exit 1
      - name: Smoke-test the web container and the nginx -> api proxy
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:5173/ >/dev/null && curl -sf http://localhost:5173/api/v1/workspaces >/dev/null && exit 0
            sleep 2
          done
          echo "web/proxy smoke check failed"
          exit 1
      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
