name: CI

# No `paths` filters: this repository is public, so Actions minutes on standard
# runners are not metered and there is nothing to save by skipping a run.
#
# They existed while the repo was private and the Free plan's 2,000 Linux
# minutes/month had been exhausted, and they excluded `**.md` and `docs/**`.
# That was never free of risk — parts of docs/ are test INPUTS rather than prose
# (docs/api/** holds the two committed GPT Actions contracts that
# tests/test_openapi_contract.py compares byte-for-byte against the builder),
# and a filtered-out event produces no run at all, so any required status check
# would sit pending forever on a docs-only pull request. Both hazards go away
# with the filters. Do not reintroduce them without also adding a skip job that
# reports the same check names.
on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs on a branch that gets pushed again. Deliberately not
# applied to main: every commit that lands there should be verified on its own,
# and a cancelled main run leaves no record of whether that commit was green.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    name: API (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      # Issue #101: the API half of the lint gate. Folded into this job rather
      # than given its own — the checkout + pip install are already paid for
      # here, and ruff itself takes about a second.
      # Run from the repo root: the rule set lives in the root pyproject.toml
      # (select = E,F,W,I) and covers any Python added outside apps/api.
      - name: Lint (ruff)
        working-directory: .
        run: ruff check .
      - run: python -m pytest

  web:
    name: Web (vitest + typecheck + lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No version here on purpose: action-setup reads packageManager from
      # package.json, so the pin lives in exactly one place.
      # That pin is pnpm 10.x, NOT 11.x. 10.26+ is what makes
      # pnpm-workspace.yaml's allowBuilds key meaningful. pnpm 11 needs
      # Node >=22.13 (it imports node:sqlite), which Node 24 now satisfies, so
      # moving to 11 is unblocked — but it is a separate change.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:web
      - run: pnpm typecheck:web
      # Issue #101: the web half of the lint gate. Narrow on purpose — typecheck
      # above already runs strict + noUnusedLocals + noUnusedParameters, so this
      # only adds the hook rules tsc cannot see. Config: apps/web/eslint.config.js.
      - run: pnpm lint:web
      - run: pnpm build:web

  # Issue #101: nothing in CI looked at dependency advisories — dependabot only
  # raised monthly version bumps. This is the scan half of that issue; the lint
  # half is folded into the api and web jobs above.
  audit:
    name: Dependency audit (pip-audit + pnpm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      # setuptools ships with the runner image as a build tool, not as a declared
      # dependency of this app — upgrade it first so its own advisories don't
      # fail a scan of the dependency tree we actually control.
      - run: pip install --upgrade pip setuptools
      - run: pip install -e "./apps/api[dev]" pip-audit
      - run: pip-audit
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Gate at high. Moderate advisories reachable only through deep transitive
      # build chains are tracked, not build-breaking.
      - run: pnpm audit --audit-level high

  api-postgres:
    name: API migrations (Postgres dialect)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: planarus
          POSTGRES_PASSWORD: planarus
          POSTGRES_DB: planarus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planarus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLANARUS_DATABASE_URL: postgresql+psycopg2://planarus:planarus@localhost:5432/planarus
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,postgres]"
      - name: Migrate to head, assert schema, roundtrip
        run: |
          alembic upgrade head
          python scripts/assert_pg_schema.py
          alembic downgrade base
          alembic upgrade head
      # Fail if the models and the migrated schema have drifted (issue #89).
      # Runs on Postgres here to also catch dialect-specific drift (e.g. a
      # partial index missing its postgresql_where); test_migrations.py runs the
      # same check on SQLite in the default job.
      - name: No model/migration drift (alembic check)
        run: alembic check
      # The rest of the suite runs on SQLite, whose single writer masks the
      # approval apply race entirely. This is the only place that exercises
      # concurrent writers on the dialect we actually deploy on. Globbed, not
      # listed: a concurrency test that names a file nobody added to this line is
      # a test that silently never runs — which is what happened to the admin one.
      - name: Concurrency (real Postgres)
        run: python -m pytest tests/test_*concurrency*.py -q

  docker-build:
    name: Docker (compose build + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: docker compose build
      - name: Start stack
        run: docker compose up -d
      - name: Wait for the API to become healthy
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T api python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)" >/dev/null 2>&1; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API never became healthy within 60s"
          exit 1
      - name: Smoke-test the web container and the nginx -> api proxy
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:5173/ >/dev/null && curl -sf http://localhost:5173/api/v1/workspaces >/dev/null && exit 0
            sleep 2
          done
          echo "web/proxy smoke check failed"
          exit 1
      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

  # The only job that runs anything under scripts/ on Windows, and it exists
  # because nothing did. Three separate faults shipped in run-planarus.bat and
  # survived - a %~f inside a REM comment that aborted the file before its first
  # command, a %BOOTSTRAP_PY% read inside a parenthesised block that made venv
  # creation fail on every fresh checkout, and a "->" in an echo that cmd parsed
  # as a redirect and turned into stray files. Every one of them was fatal on a
  # clean machine, and every one was invisible to a suite that only exercised
  # pytest, vitest and the Docker path.
  windows-scripts:
    name: Windows (launcher + tray scripts)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Asserted separately so that an image without it fails here, with an
      # obvious reason, rather than further down as "the launcher did not
      # bootstrap" - the script resolves its interpreter through the launcher,
      # not through whatever setup-python put on PATH.
      - name: Python launcher resolves 3.11
        shell: cmd
        run: py -3.11 --version

      # `help` alone would have caught the %~f fault: the file aborted on parse,
      # so every invocation failed, including this one.
      - name: Argument handling and exit codes
        shell: cmd
        run: |
          call scripts\run-planarus.bat help || exit /b 1
          call scripts\run-planarus.bat bogus && exit /b 1
          call scripts\stop-planarus.bat || exit /b 1
          exit /b 0

      - name: Tray script parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/planarus-tray.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors -and $errors.Count) {
            $errors | ForEach-Object { Write-Host "line $($_.Extent.StartLineNumber): $($_.Message)" }
            throw "planarus-tray.ps1 does not parse"
          }

      # An unescaped ">" in an echo is a redirect, and this is what caught it:
      # the script reported success while writing junk files named after its own
      # shortcuts into whatever directory it ran from.
      - name: Shortcuts write nothing into the repository
        shell: pwsh
        run: |
          cmd /c scripts\create-shortcuts.bat
          if ($LASTEXITCODE -ne 0) { throw "create-shortcuts.bat exited $LASTEXITCODE" }
          $dirty = git status --porcelain
          if ($dirty) { Write-Host $dirty; throw "create-shortcuts.bat wrote files into the working tree" }

      # The real bootstrap. Waiting on the port file rather than on a served
      # page is deliberate: :write_ports runs after the environment is built and
      # before either service starts, so this asserts the half that a fresh
      # machine actually depends on without also waiting out two servers.
      - name: Bootstrap from a checkout with no virtual environment
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ports = Join-Path $env:LOCALAPPDATA 'Planarus\local.ports'
          Remove-Item $ports -Force -ErrorAction SilentlyContinue
          Start-Process cmd -ArgumentList '/c', 'scripts\run-planarus.bat' -WorkingDirectory $PWD
          $deadline = (Get-Date).AddMinutes(12)
          while ((Get-Date) -lt $deadline -and -not (Test-Path $ports)) { Start-Sleep -Seconds 5 }
          if (-not (Test-Path $ports)) {
            throw "run-planarus.bat never reached :write_ports - it failed during bootstrap"
          }
          Get-Content $ports

      - name: Stop
        if: always()
        shell: cmd
        run: call scripts\stop-planarus.bat
