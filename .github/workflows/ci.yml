name: CI

# Actions minutes are metered on this repo because it is private, and the Free
# plan allowance is 2,000 Linux minutes/month. July 2026 blew past it (2,020 min)
# and every job started failing with "the job was not started because ... your
# spending limit needs to be increased". The two filters below are the cheap half
# of the fix; the structural half is going public, which #119 still gates.
#
# Skipping is safe here only because this repo has no required status checks
# (branch protection is a Pro feature and this is a private repo on Free). If
# protection is ever enabled, a docs-only PR would sit pending forever — either
# drop these filters or add a skip job that reports the same check names.
# Note also that GitHub Actions does not support YAML anchors, so the list is
# duplicated rather than shared.
#
# `paths` with `!`, not `paths-ignore`: two paths under docs/ are test INPUTS,
# not documentation, and skipping them would let CI pass on a change it never
# saw. `paths-ignore` cannot express "ignore this subtree except that part" —
# negation is only supported in `paths`, and the two filters cannot both apply
# to one event. Order matters: later patterns win, so the re-includes must come
# last.
#   docs/api/**  — the two committed GPT Actions contracts, which
#                  tests/test_openapi_contract.py compares byte-for-byte against
#                  the builder. A hand-edit there is a broken contract, not a typo.
#
# `docs/plan/**` used to be re-included here for tests/test_docs_truth.py's
# plan-doc numbering and index checks. Those documents are no longer published
# and those checks are gone, so there is nothing left under docs/ that is a test
# input except docs/api/.
#
# `context/**` stays in the exclusion list even though the directory is no longer
# tracked: the pattern is harmless and keeps the filter correct if a context/
# path is ever reintroduced.
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!context/**"
      - "docs/api/**"
  pull_request:
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!context/**"
      - "docs/api/**"

# Supersede in-flight runs on a branch that gets pushed again. Deliberately not
# applied to main: every commit that lands there should be verified on its own,
# and a cancelled main run leaves no record of whether that commit was green.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    name: API (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      # Issue #101: the API half of the lint gate. Folded into this job rather
      # than given its own — the checkout + pip install are already paid for
      # here, and ruff itself takes about a second.
      # Run from the repo root: the rule set lives in the root pyproject.toml
      # (select = E,F,W,I) and covers any Python added outside apps/api.
      - name: Lint (ruff)
        working-directory: .
        run: ruff check .
      - run: python -m pytest

  web:
    name: Web (vitest + typecheck + lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No version here on purpose: action-setup reads packageManager from
      # package.json, so the pin lives in exactly one place.
      # That pin is pnpm 10.x, NOT 11.x: pnpm 11 requires Node >=22.13 (it
      # imports node:sqlite) and this repo is on Node 20. 10.26+ is what makes
      # pnpm-workspace.yaml's allowBuilds key meaningful. Raising Node to 22
      # would let us move to pnpm 11 — a separate change.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:web
      - run: pnpm typecheck:web
      # Issue #101: the web half of the lint gate. Narrow on purpose — typecheck
      # above already runs strict + noUnusedLocals + noUnusedParameters, so this
      # only adds the hook rules tsc cannot see. Config: apps/web/eslint.config.js.
      - run: pnpm lint:web
      - run: pnpm build:web

  # Issue #101: nothing in CI looked at dependency advisories — dependabot only
  # raised monthly version bumps. This is the scan half of that issue; the lint
  # half is folded into the api and web jobs above.
  audit:
    name: Dependency audit (pip-audit + pnpm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      # setuptools ships with the runner image as a build tool, not as a declared
      # dependency of this app — upgrade it first so its own advisories don't
      # fail a scan of the dependency tree we actually control.
      - run: pip install --upgrade pip setuptools
      - run: pip install -e "./apps/api[dev]" pip-audit
      - run: pip-audit
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Gate at high. Moderate advisories reachable only through deep transitive
      # build chains are tracked, not build-breaking.
      - run: pnpm audit --audit-level high

  api-postgres:
    name: API migrations (Postgres dialect)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: planarus
          POSTGRES_PASSWORD: planarus
          POSTGRES_DB: planarus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planarus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLANARUS_DATABASE_URL: postgresql+psycopg2://planarus:planarus@localhost:5432/planarus
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,postgres]"
      - name: Migrate to head, assert schema, roundtrip
        run: |
          alembic upgrade head
          python scripts/assert_pg_schema.py
          alembic downgrade base
          alembic upgrade head
      # Fail if the models and the migrated schema have drifted (issue #89).
      # Runs on Postgres here to also catch dialect-specific drift (e.g. a
      # partial index missing its postgresql_where); test_migrations.py runs the
      # same check on SQLite in the default job.
      - name: No model/migration drift (alembic check)
        run: alembic check
      # The rest of the suite runs on SQLite, whose single writer masks the
      # approval apply race entirely. This is the only place that exercises
      # concurrent writers on the dialect we actually deploy on. Globbed, not
      # listed: a concurrency test that names a file nobody added to this line is
      # a test that silently never runs — which is what happened to the admin one.
      - name: Concurrency (real Postgres)
        run: python -m pytest tests/test_*concurrency*.py -q

  docker-build:
    name: Docker (compose build + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: docker compose build
      - name: Start stack
        run: docker compose up -d
      - name: Wait for the API to become healthy
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T api python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)" >/dev/null 2>&1; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API never became healthy within 60s"
          exit 1
      - name: Smoke-test the web container and the nginx -> api proxy
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:5173/ >/dev/null && curl -sf http://localhost:5173/api/v1/workspaces >/dev/null && exit 0
            sleep 2
          done
          echo "web/proxy smoke check failed"
          exit 1
      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
