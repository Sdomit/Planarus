<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1220"></stop>
      <stop offset="0.55" stop-color="#111A31"></stop>
      <stop offset="1" stop-color="#0D1220"></stop>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2D6CC8"></stop>
      <stop offset="1" stop-color="#7A63C7"></stop>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7A8BB0"></path>
    </marker>
  </defs>

  <rect width="1180" height="520" fill="url(#field)"></rect>

  <rect x="40" y="40" width="200" height="64" rx="12" fill="#16203A" stroke="#374155" stroke-width="1.5"></rect>
  <text x="140" y="78" text-anchor="middle" font-size="20" font-weight="600" fill="#FFFFFF">Human</text>

  <rect x="40" y="200" width="200" height="64" rx="12" fill="#16203A" stroke="#374155" stroke-width="1.5"></rect>
  <text x="140" y="238" text-anchor="middle" font-size="20" font-weight="600" fill="#FFFFFF">Agent</text>

  <rect x="320" y="40" width="260" height="64" rx="12" fill="#16203A" stroke="#374155" stroke-width="1.5"></rect>
  <text x="450" y="72" text-anchor="middle" font-size="17" font-weight="600" fill="#FFFFFF">React + TS + Vite</text>
  <text x="450" y="92" text-anchor="middle" font-size="13" fill="#9AA6BF">Web UI</text>

  <rect x="320" y="200" width="260" height="64" rx="12" fill="url(#gate)"></rect>
  <text x="450" y="238" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">Approval boundary</text>

  <rect x="660" y="120" width="220" height="64" rx="12" fill="#5DB7F2"></rect>
  <text x="770" y="152" text-anchor="middle" font-size="18" font-weight="700" fill="#0D1220">FastAPI</text>
  <text x="770" y="172" text-anchor="middle" font-size="13" fill="#0D1220">Python 3.11</text>

  <rect x="960" y="30" width="180" height="60" rx="12" fill="#16203A" stroke="#374155" stroke-width="1.5"></rect>
  <text x="1050" y="66" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">SQLite (WAL)</text>

  <rect x="960" y="120" width="180" height="60" rx="12" fill="#16203A" stroke="#374155" stroke-width="1.5"></rect>
  <text x="1050" y="146" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">Project folders</text>
  <text x="1050" y="166" text-anchor="middle" font-size="13" fill="#9AA6BF">Markdown context</text>

  <rect x="960" y="210" width="180" height="60" rx="12" fill="#16203A" stroke="#374155" stroke-width="1.5"></rect>
  <text x="1050" y="246" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">MCP + REST</text>

  <line x1="240" y1="72" x2="320" y2="72" stroke="#7A8BB0" stroke-width="2" marker-end="url(#arrow)"></line>
  <line x1="240" y1="232" x2="320" y2="232" stroke="#7A8BB0" stroke-width="2" marker-end="url(#arrow)"></line>
  <line x1="580" y1="72" x2="660" y2="140" stroke="#7A8BB0" stroke-width="2" marker-end="url(#arrow)"></line>
  <line x1="580" y1="232" x2="660" y2="160" stroke="#7A8BB0" stroke-width="2" marker-end="url(#arrow)"></line>
  <line x1="880" y1="150" x2="960" y2="60" stroke="#7A8BB0" stroke-width="2" marker-end="url(#arrow)"></line>
  <line x1="880" y1="152" x2="960" y2="150" stroke="#7A8BB0" stroke-width="2" marker-end="url(#arrow)"></line>
  <line x1="880" y1="155" x2="960" y2="240" stroke="#7A8BB0" stroke-width="2" marker-end="url(#arrow)"></line>

  <g transform="translate(320,320)">
    <path d="M0 140 C 40 96, 120 74, 210 66" fill="none" stroke="#7A63C7" stroke-width="4" stroke-linecap="round"></path>
    <circle cx="26" cy="118" r="9" fill="#0D1220" stroke="#7A63C7" stroke-width="4"></circle>
    <circle cx="82" cy="90" r="9" fill="#0D1220" stroke="#7A63C7" stroke-width="4"></circle>
    <circle cx="146" cy="74" r="9" fill="#0D1220" stroke="#7A63C7" stroke-width="4"></circle>
    <circle cx="210" cy="66" r="9" fill="#0D1220" stroke="#7A63C7" stroke-width="4"></circle>
  </g>

  <text x="580" y="404" font-size="15" font-weight="600" fill="#FFFFFF">Every write from the Agent lane crosses the approval boundary before it reaches FastAPI.</text>
  <text x="580" y="430" font-size="14" fill="#9AA6BF">Humans plan and approve on the same graph. Agents only ever read and propose.</text>
</svg>
