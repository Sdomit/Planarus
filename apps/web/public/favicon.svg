<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Planarus">
  <!-- Original mark: the sidebar's rounded-square "P" (layout.css .ab-brand-mark).
       Drawn as a path, not <text>, so it never depends on a font being available.
       Brand blue matches --ab-brand-cool; the dark variant uses the lighter
       #60A5FA so the mark keeps contrast against a dark browser tab strip. -->
  <style>
    .bg { fill: #2563EB; }
    @media (prefers-color-scheme: dark) { .bg { fill: #60A5FA; } }
  </style>
  <rect class="bg" width="32" height="32" rx="7" />
  <path
    fill="#fff"
    fill-rule="evenodd"
    d="M10 7h7a5 5 0 0 1 0 10h-3v8h-4V7zm4 3.5v4h3a2 2 0 0 0 0-4h-3z"
  />
</svg>
