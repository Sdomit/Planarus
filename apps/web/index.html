<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/planarus-icon.png" />
    <link rel="apple-touch-icon" href="/planarus-icon.png" />
    <title>Planarus</title>
    <script>
      // Resolve the theme before first paint, otherwise a dark-OS user gets a
      // white flash on every load. Inline and synchronous on purpose — the app
      // bundle is a module and runs too late to prevent it.
      // localStorage throws in some privacy modes, so fall back to the OS.
      (function () {
        var stored = null
        try { stored = localStorage.getItem('planarus.theme') } catch (e) {}
        // Only the cosmo pair exists (#157 deleted the sixteen unreachable
        // palettes), so anything else — the retired light-blue/dark-blue default,
        // a hand-set value, a future rename — is normalised to the matching mode
        // rather than applied verbatim. Without this, a stale value would select
        // a theme whose block is gone and render half-styled.
        if (stored !== 'light-cosmo' && stored !== 'dark-cosmo') {
          stored = stored ? (stored.indexOf('dark') === 0 ? 'dark-cosmo' : 'light-cosmo') : null
        }
        var prefersDark =
          window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.setAttribute(
          'data-theme',
          stored || (prefersDark ? 'dark-cosmo' : 'light-cosmo'),
        )
      })()
    </script>
    <style>
      #planarus-dev-marker {
        position: fixed; z-index: 10000; top: 12px; right: 12px;
        padding: 5px 9px; border: 1px solid #dc2626; border-radius: 999px;
        background: #fef2f2; color: #b91c1c; font: 700 11px/1 system-ui, sans-serif;
        letter-spacing: .08em; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="planarus-dev-marker" aria-label="Development environment">DEVELOPMENT</div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
