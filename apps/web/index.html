<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Approvo</title>
    <script>
      // Resolve the theme before first paint, otherwise a dark-OS user gets a
      // white flash on every load. Inline and synchronous on purpose — the app
      // bundle is a module and runs too late to prevent it.
      // localStorage throws in some privacy modes, so fall back to the OS.
      (function () {
        var stored = null
        try { stored = localStorage.getItem('approvo.theme') } catch (e) {}
        var prefersDark =
          window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.setAttribute(
          'data-theme',
          stored || (prefersDark ? 'dark-blue' : 'light-blue'),
        )
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
