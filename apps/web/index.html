<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/planarus-icon.png" />
    <link rel="apple-touch-icon" href="/planarus-icon.png" />
    <title>Planarus</title>
    <script>
      // Resolve the theme before first paint, otherwise a dark-OS user gets a
      // white flash on every load. Inline and synchronous on purpose — the app
      // bundle is a module and runs too late to prevent it.
      // localStorage throws in some privacy modes, so fall back to the
      // reference's light presentation.
      (function () {
        var stored = null
        try { stored = localStorage.getItem('planarus.theme') } catch (e) {}
        // Blue was the old fixed default rather than a user-selectable choice.
        // Move it forward before first paint so returning local users see the
        // Cosmo brand immediately instead of a flash of the retired palette.
        if (stored === 'light-blue') stored = 'light-cosmo'
        if (stored === 'dark-blue') stored = 'dark-cosmo'
        document.documentElement.setAttribute(
          'data-theme',
          stored || 'light-cosmo',
        )
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
