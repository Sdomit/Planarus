server {
    listen 80;
    server_name localhost;

    # /api → backend container. Force Host: localhost so AgentBoard's loopback
    # Host-header guard (DNS-rebinding defense) accepts the proxied request.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA: serve static assets, fall back to index.html for client-side routes.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
