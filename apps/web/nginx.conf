server {
    listen 80;
    server_name localhost;

    # --- #118: Content Security Policy -------------------------------------
    # The last line of defense behind `app/core/uri_policy.py` and
    # `src/app/uri-policy.ts`: those two decide what may be *stored*, this
    # decides what the browser will act on if something slips past them.
    #
    # `script-src` carries the sha256 of the theme-resolving inline script in
    # index.html, so that one script runs and no other inline script does.
    # `uri-policy.test.ts` recomputes the hash from index.html and fails if this
    # line drifts — edit the script and the test tells you the new value.
    #
    # `img-src` is deliberately *narrower* than the storage policy: the server
    # accepts a plain-http remote image, and this refuses to load one. A stored
    # URL that will not render is a safe failure; the reverse is not.
    # `style-src` needs 'unsafe-inline' for React style attributes and the
    # styles Excalidraw injects at runtime.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'sha256-1Ud+nA9cODDD1uuHAjsmWUTg+rrOKlKqs7XRaC9LUzQ='; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # /api → backend container. Force Host: localhost so Planarus's loopback
    # Host-header guard (DNS-rebinding defense) accepts the proxied request.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA: serve static assets, fall back to index.html for client-side routes.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
