[project]
name = "approvo-api"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.21",
    "pydantic-settings>=2.0.0",
    "alembic>=1.13.0",
    # Phase 7B STDIO MCP server. Pinned to one exact resolved version (no range).
    "mcp==1.28.0",
    # Phase 7C1 external API key hashing (Argon2id). Pinned to one exact version.
    "argon2-cffi==25.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Package only `app`; `alembic/` is migration scripts, not a distributed package.
# Without this, setuptools auto-discovery errors on the flat multi-package layout.
[tool.setuptools]
packages = ["app"]
