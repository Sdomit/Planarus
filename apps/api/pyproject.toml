[project]
name = "approvo-api"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.21",
    "pydantic-settings>=2.0.0",
    "alembic>=1.13.0",
    # Phase 7B STDIO MCP server. Pinned to one exact resolved version (no range).
    "mcp==1.28.0",
    # Phase 7C1 external API key hashing (Argon2id). Pinned to one exact version.
    "argon2-cffi==25.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    # P10.3b: mocked S3 so the s3 storage backend is covered in CI without AWS.
    # Pulls boto3, so the s3 backend imports resolve in the test run too.
    "moto[s3]>=5.0",
]
# P10.0: driver for the Postgres dialect CI job; the app itself stays
# SQLite-by-default and never requires this locally.
postgres = [
    "psycopg2-binary>=2.9",
]
# P10.1b: HTTP client for real OAuth token/userinfo calls. Only needed when an
# OAuth provider is configured; the dev-login provider and tests don't require it.
oauth = [
    "httpx>=0.27.0",
]
# P15.12b: calendar external sync (Google/Microsoft). httpx for the provider
# calls + cryptography (Fernet) to encrypt stored OAuth tokens at rest. Inert
# unless AGENTBOARD_CALENDAR_ENC_KEY + a provider client id are configured.
calendar-sync = [
    "httpx>=0.27.0",
    "cryptography>=42.0",
]
# P17.3: outbound webhooks. cryptography (Fernet) encrypts each subscription's
# HMAC signing secret at rest. Inert unless AGENTBOARD_WEBHOOK_ENC_KEY is set.
webhooks = [
    "cryptography>=42.0",
]
# P10.3b: AWS SDK for the S3 storage backend. Only needed when
# AGENTBOARD_STORAGE_BACKEND=s3; local/memory backends never import it.
s3 = [
    "boto3>=1.34",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Package only `app`; `alembic/` is migration scripts, not a distributed package.
# Without this, setuptools auto-discovery errors on the flat multi-package layout.
[tool.setuptools]
packages = ["app"]
